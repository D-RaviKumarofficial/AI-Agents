[project]
name = "ecrime-demo"
version = "1.0.0"
description = "FastAPI + SQLite backend for the reconstructed services demo (synthetic data only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.8",
    "aiosqlite==0.22.1",
    "pydantic-settings==2.16.2",
    "greenlet==3.5.6",
    "boto3==1.43.5",
    "python-dotenv==1.2.2",
    "faster-whisper==1.2.1",
    "av==18.1.0",
    "huggingface-hub==0.36.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "pytest-cov==7.1.0", "httpx==0.28.1", "ruff==0.17.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecrime_demo"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]
ignore = ["D203", "D213", "D104", "D105", "D107", "D401", "ANN401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101"]
